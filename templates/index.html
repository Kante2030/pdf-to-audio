<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF to Audio Converter</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 15px;
            width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
            width: 100%;
            background: white;
            border-radius: 5px;
        }

        button {
            background: #00c6ff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #0072ff;
        }

        .footer {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>📄 PDF to Audio Converter</h1>

        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="pdf" required>
            <button type="submit">Convert to Audio</button>
        </form>

        <div class="footer">
            Upload a PDF and listen instantly
        </div>
    </div>

</body>
</html>
